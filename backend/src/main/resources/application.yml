logging:
  level:
    org:
      atmosphere: warn
server:
  port: ${PORT:8080}

spring:
  docker:
    compose:
      lifecycle-management: none

  ai:
    ollama:
      init:
        pull-model-strategy: when_missing
        timeout: 5m
        max-retries: 1
      chat:
        model: ${CHAT_MODEL:socratic-tutor:latest}
      #model: ${CHAT_MODEL:qwen2.5-coder:3b}
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${EMBEDDING_MODEL:qwen3-embedding:0.6b}
        options:
          dimensions: 1024
    vectorstore:
      chroma:
        initialize-schema: false
        collection-name: ${VECTOR_STORE_COLLECTION_NAME:socratic_tutor_collection}
        tenant-name: default_tenant
        database-name: default_database

app:
  ai:
    guard:
      model: ${GUARD_MODEL:qwen2.5:3b-instruct}

vaadin:
  allowed-packages: com.vaadin,org.vaadin,com.flowingcode,com.wornux
  launch-browser: true
