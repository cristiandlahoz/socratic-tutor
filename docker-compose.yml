# docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────────
# Services:
#   chromadb   – vector database (official image)
#   inference  – Python FastAPI wrapper for the LoRA model (GPU required)
#   backend    – Spring Boot + Vaadin application
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   make up                # docker compose up -d
#   make logs              # docker compose logs -f
#   make down              # docker compose down
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  TZ: UTC

x-healthcheck-defaults: &healthcheck-defaults
  interval: 15s
  timeout:  5s
  retries:  5

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── ChromaDB ────────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    environment:
      <<: *common-env
      ANONYMIZED_TELEMETRY: "false"
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]

  # ── Inference (Python FastAPI + LoRA model) ──────────────────────────────────
  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
    restart: unless-stopped
    environment:
      <<: *common-env
      MODEL_PATH:     ${MODEL_PATH:-outputs/socratic-tutor-lora}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-512}
      TEMPERATURE:    ${TEMPERATURE:-0.7}
      TOP_P:          ${TOP_P:-0.9}
      PORT:           "8001"
    ports:
      - "${INFERENCE_PORT:-8001}:8001"
    volumes:
      - ./outputs:/app/outputs:ro
      - ./data:/app/data:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/health"]

  # ── Backend (Spring Boot + Vaadin) ───────────────────────────────────────────
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      chromadb:
        condition: service_healthy
      inference:
        condition: service_healthy
    environment:
      <<: *common-env
      DB_URL:        ${DB_URL:-jdbc:postgresql://postgres:5432/this_studio}
      DB_USER:       ${DB_USER:-postgres}
      DB_PASS:       ${DB_PASS:-postgres}
      INFERENCE_URL: http://inference:8001
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]

  # ── PostgreSQL (used by backend) ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      <<: *common-env
      POSTGRES_DB:       ${DB_NAME:-this_studio}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  chroma_data:
  postgres_data:
