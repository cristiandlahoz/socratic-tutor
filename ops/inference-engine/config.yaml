# llama-swap configuration for the Socratic Tutor inference engine.
# Exposes one OpenAI-compatible endpoint; select the backend with the request `model`.

# Some HF models take more than the default 120s to download/load on cold start.
healthCheckTimeout: 600

# Include upstream llama-server logs. This makes model download/load failures visible.
logToStdout: both

models:
  "AtomicChat/ornith-9b-GGUF:UD-Q4_K_XL":
    proxy: "http://127.0.0.1:${PORT}"
    cmd: |
      ./start-llama-server.sh AtomicChat/ornith-9b-GGUF:UD-Q4_K_XL ${PORT} 7000 8192

  "unsloth/gemma-4-E4B-it-GGUF:IQ4_XS":
    proxy: "http://127.0.0.1:${PORT}"
    cmd: |
      ./start-llama-server.sh unsloth/gemma-4-E4B-it-GGUF:IQ4_XS ${PORT} 4000 20000

# Allow both models to remain loaded concurrently.
matrix:
  vars:
    o: "AtomicChat/ornith-9b-GGUF:UD-Q4_K_XL"
    g: "unsloth/gemma-4-E4B-it-GGUF:IQ4_XS"
  sets:
    both: "o & g"

# Startup warm-up is handled by run-inference-engine.sh with real
# /v1/chat/completions requests. This is also the model download step:
# if the GGUF is missing from the llama.cpp HF cache, llama-server fetches it.
# Do not use llama-swap's preload hook here: llama-swap v233 preloads with GET /,
# which returns 404 when llama-server is intentionally started with --no-ui.
