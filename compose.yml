services:
  postgres:
    image: "pgvector/pgvector:pg18"
    environment:
      - "POSTGRES_DB=socratic-tutor"
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=postgres"
    volumes:
      - db_postgres:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-4321}:5432"
  mailpit:
    image: "axllent/mailpit:v1.27"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - mailpit_data:/data
  docling:
    image: "ghcr.io/docling-project/docling-serve-cpu:v1.18.0"
    ports:
      - "${DOCLING_PORT:-5001}:5001"
  app:
    profiles:
      - app
    build:
      context: .
      dockerfile: ops/docker/app/Dockerfile
    environment:
      - "PORT=6543"
      - "SPRING_PROFILES_ACTIVE=dev"
      - "SPRING_DOCKER_COMPOSE_LIFECYCLE_MANAGEMENT=none"
      - "DATABASE_URL=jdbc:postgresql://postgres:5432/socratic-tutor"
      - "DATABASE_USERNAME=postgres"
      - "DATABASE_PASSWORD=postgres"
      - "ARCONIA_DOCLING_BASE_URL=http://docling:5001"
      - "SOCRATIC_EMAIL_SMTP_HOST=mailpit"
      - "SOCRATIC_EMAIL_SMTP_PORT=1025"
      - "SOCRATIC_EMAIL_SMTP_USERNAME="
      - "SOCRATIC_EMAIL_SMTP_PASSWORD="
      - "SOCRATIC_EMAIL_SMTP_AUTH=false"
      - "SOCRATIC_EMAIL_SMTP_STARTTLS_ENABLED=false"
      - "C_RUNNER_COMPILER_IMAGE=${C_RUNNER_COMPILER_IMAGE:-cristiandelahooz/socratic-tutor-crunner:latest}"
      - "C_RUNNER_DEBUGGER_IMAGE=${C_RUNNER_DEBUGGER_IMAGE:-cristiandelahooz/socratic-tutor-crunner:latest}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${APP_PORT:-6543}:6543"
    depends_on:
      - postgres
      - mailpit
      - docling
volumes:
  db_postgres: {}
  mailpit_data: {}
