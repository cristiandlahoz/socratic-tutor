services:
  postgres:
    image: "pgvector/pgvector:pg18"
    environment:
      - 'POSTGRES_DB=socratic-tutor'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=postgres'
    volumes:
      - db_postgres:/var/lib/postgresql
    ports:
      - '${POSTGRES_PORT:-4321}:5432'
  docling:
    build:
      context: ./docker/docling
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HOME=/opt/hf-cache
    ports:
      - "${DOCLING_PORT:-5001}:5001"
volumes:
  db_postgres: { }
