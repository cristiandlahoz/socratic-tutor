logging:
  level:
    org:
      atmosphere: warn
server:
  port: ${PORT:8080}

spring:
  profiles:
    default: dev
  servlet:
    multipart:
      enabled: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:4321}/socratic-tutor}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
  docker:
    compose:
      lifecycle-management: none

  ai:
    ollama:
      init:
        pull-model-strategy: when_missing
        timeout: 5m
        max-retries: 1
        chat:
          additional-models:
            - "qwen3:4b-instruct"
      chat:
        model: ${CHAT_MODEL:qwen3:4b-instruct}
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${EMBEDDING_MODEL:qwen3-embedding:0.6b}
        options:
          dimensions: 1024
    vectorstore:
      pgvector:
        initialize-schema: false
        schema-name: public
        table-name: vector_store
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW

app:
  chat:
    client-id-cookie-name: ${CHAT_CLIENT_ID_COOKIE_NAME:st_client_id}
    context-window-tokens: ${CHAT_CONTEXT_WINDOW_TOKENS:40960}
    compaction-threshold-ratio: ${CHAT_COMPACTION_THRESHOLD_RATIO:0.30}
    ui:
      thinking-spinner: ${CHAT_UI_THINKING_SPINNER:snake}
  ai:
    guard:
      model: ${GUARD_MODEL:qwen3:4b-instruct}
    profile:
      enabled: ${AI_PROFILE_ENABLED:true}
      shadow-mode: ${AI_PROFILE_SHADOW_MODE:false}
      misconception-ttl-days: ${AI_PROFILE_MISCONCEPTION_TTL_DAYS:21}
    tutor:
      routing-model: ${ROUTING_MODEL:${spring.ai.ollama.chat.model}}
    title:
      model: ${TITLE_MODEL:${spring.ai.ollama.chat.model}}
    document-catalog:
      model: ${DOCUMENT_CATALOG_MODEL:${spring.ai.ollama.chat.model}}
  document-ingest:
    docling-base-url: ${DOCLING_BASE_URL:http://localhost:5001}
    docling-connect-timeout: ${DOCLING_CONNECT_TIMEOUT:5s}
    docling-read-timeout: ${DOCLING_READ_TIMEOUT:5m}
    max-file-size-bytes: ${DOCUMENT_MAX_FILE_SIZE_BYTES:20971520}
    retrieval-top-k: ${DOCUMENT_RETRIEVAL_TOP_K:4}
    retrieval-similarity-threshold: ${DOCUMENT_RETRIEVAL_SIMILARITY_THRESHOLD:0.55}
    chunking:
      hybrid:
        max-tokens: ${DOCUMENT_CHUNK_MAX_TOKENS:512}
        tokenizer: ${DOCUMENT_CHUNK_TOKENIZER:/opt/tokenizers/qwen3-0.6b-tokenizer}
        merge-peers: ${DOCUMENT_CHUNK_MERGE_PEERS:true}
        use-markdown-tables: ${DOCUMENT_CHUNK_USE_MARKDOWN_TABLES:true}
        include-raw-text: ${DOCUMENT_CHUNK_INCLUDE_RAW_TEXT:true}
    catalog:
      max-tags: ${DOCUMENT_CATALOG_MAX_TAGS:8}
      max-question-examples: ${DOCUMENT_CATALOG_MAX_QUESTION_EXAMPLES:6}
    inventory:
      max-documents: ${DOCUMENT_INVENTORY_MAX_DOCUMENTS:8}
      max-chars: ${DOCUMENT_INVENTORY_MAX_CHARS:2400}
  c-runner:
    compiler-image: ${C_RUNNER_COMPILER_IMAGE:gcc:15.2.0-bookworm}
    debugger-image: ${C_RUNNER_DEBUGGER_IMAGE:socratic-tutor/c-runner:local}
    timeout: ${C_RUNNER_TIMEOUT:8s}
    debug-timeout: ${C_RUNNER_DEBUG_TIMEOUT:12s}
    max-source-bytes: ${C_RUNNER_MAX_SOURCE_BYTES:65536}
    max-snapshots: ${C_RUNNER_MAX_SNAPSHOTS:300}
    max-output-bytes: ${C_RUNNER_MAX_OUTPUT_BYTES:16384}
    memory: ${C_RUNNER_MEMORY:128m}
    debugger-memory: ${C_RUNNER_DEBUGGER_MEMORY:512m}
    cpus: ${C_RUNNER_CPUS:0.5}
    pids-limit: ${C_RUNNER_PIDS_LIMIT:64}
    cache-maximum-size: ${C_RUNNER_CACHE_MAXIMUM_SIZE:256}
    cache-ttl: ${C_RUNNER_CACHE_TTL:10m}

vaadin:
  allowed-packages: com.vaadin,org.vaadin,com.flowingcode,com.wornux
  launch-browser: true
  pnpm:
    enable: true
---
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor:
                SimpleLoggerAdvisor: DEBUG
spring:
  ai:
    chat:
      client:
        observations:
          log-prompt: true
          log-completion: true
    tools:
      throw-exception-on-error: true
      observations:
        include-content: true
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      lifecycle-management: start-only

