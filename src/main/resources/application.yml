logging:
  level:
    org:
      atmosphere: warn
      springframework:
        ai:
          chat:
            model:
              MessageAggregator: off
server:
  port: ${PORT:3321}

spring:
  config:
    import:
      - optional:file:.env[.properties]
  profiles:
    default: dev
  servlet:
    multipart:
      enabled: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:4321}/socratic-tutor}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  flyway:
    enabled: true
    locations: classpath:db/migration/prod
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  docker:
    compose:
      lifecycle-management: none

  ai:
    session:
      repository:
        jdbc:
          initialize-schema: never
    vectorstore:
      pgvector:
        table-name: grounding_vector_store
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: false
        schema-validation: true
    model:
      chat: openai
      embedding: ollama
    openai:
      api-key: ${OPENAI_API_KEY:dummy}
      base-url: ${OPENAI_BASE_URL:http://127.0.0.1:8080/v1}
      timeout: ${OPENAI_TIMEOUT:5m}
      chat:
        model: ${CHAT_MODEL:AtomicChat/ornith-9b-GGUF:UD-Q4_K_XL}
    ollama:
      init:
        pull-model-strategy: when_missing
        timeout: 5m
        max-retries: 1
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${EMBEDDING_MODEL:qwen3-embedding:0.6b}
arconia:
  docling:
    read-timeout: ${DOCLING_READ_TIMEOUT:5m}
  dev:
    services:
      docling:
        enabled: false
        image-name: ghcr.io/docling-project/docling-serve-cpu:v1.18.0
        startup-timeout: 3m

app:
  security:
    disable-for-local-development: ${SECURITY_DISABLE:false}
  ai:
    conversation:
      config:
        context-window-tokens: ${AI_CONVERSATION_CONTEXT_WINDOW_TOKENS:20000}
        compaction-threshold-ratio: ${AI_CONVERSATION_COMPACTION_THRESHOLD_RATIO:0.70}
        recent-history-retention-ratio: ${AI_CONVERSATION_RECENT_HISTORY_RETENTION_RATIO:0.25}
      ui:
        thinking-spinner: ${AI_CONVERSATION_UI_THINKING_SPINNER:snake}
    switzerland-knife:
      model: ${SWITZERLAND_KNIFE_MODEL:unsloth/gemma-4-E4B-it-GGUF:IQ4_XS}
    model-availability:
      timeout: ${AI_MODEL_AVAILABILITY_TIMEOUT:2s}
      probe-interval-ms: ${AI_MODEL_AVAILABILITY_PROBE_INTERVAL_MS:10000}
      initial-delay-ms: ${AI_MODEL_AVAILABILITY_INITIAL_DELAY_MS:1000}
    adaptive-tutor:
      model: ${ADAPTIVE_TUTOR_MODEL:${spring.ai.openai.chat.model}}
      allow-local-fallback: ${ADAPTIVE_TUTOR_ALLOW_LOCAL_FALLBACK:false}
    instruction-review:
      model: ${INSTRUCTION_REVIEW_MODEL:${app.ai.switzerland-knife.model}}
      max-tokens: ${INSTRUCTION_REVIEW_MAX_TOKENS:192}
      temperature: ${INSTRUCTION_REVIEW_TEMPERATURE:0.0}
    tool-audit:
      capture-tool-returns: ${TOOL_AUDIT_CAPTURE_TOOL_RETURNS:false}
      preview-max-chars: ${TOOL_AUDIT_PREVIEW_MAX_CHARS:96}
  document-ingest:
    max-file-size-bytes: ${DOCUMENT_MAX_FILE_SIZE_BYTES:20971520}
    retrieval-top-k: ${DOCUMENT_RETRIEVAL_TOP_K:4}
    retrieval-similarity-threshold: ${DOCUMENT_RETRIEVAL_SIMILARITY_THRESHOLD:0.55}
    chunking:
      hybrid:
        max-tokens: ${DOCUMENT_CHUNK_MAX_TOKENS:1024}
        tokenizer: ${DOCUMENT_CHUNK_TOKENIZER:Qwen/Qwen3-Embedding-0.6B}
        merge-peers: ${DOCUMENT_CHUNK_MERGE_PEERS:true}
        use-markdown-tables: ${DOCUMENT_CHUNK_USE_MARKDOWN_TABLES:true}
        include-raw-text: ${DOCUMENT_CHUNK_INCLUDE_RAW_TEXT:true}
  c-runner:
    compiler-image: ${C_RUNNER_COMPILER_IMAGE:cristiandelahooz/socratic-tutor-crunner:latest}
    debugger-image: ${C_RUNNER_DEBUGGER_IMAGE:cristiandelahooz/socratic-tutor-crunner:latest}
    timeout: ${C_RUNNER_TIMEOUT:8s}
    debug-timeout: ${C_RUNNER_DEBUG_TIMEOUT:12s}
    max-source-bytes: ${C_RUNNER_MAX_SOURCE_BYTES:65536}
    max-snapshots: ${C_RUNNER_MAX_SNAPSHOTS:1000}
    max-output-bytes: ${C_RUNNER_MAX_OUTPUT_BYTES:16384}
    memory: ${C_RUNNER_MEMORY:128m}
    debugger-memory: ${C_RUNNER_DEBUGGER_MEMORY:512m}
    cpus: ${C_RUNNER_CPUS:0.5}
    pids-limit: ${C_RUNNER_PIDS_LIMIT:64}
    cache-maximum-size: ${C_RUNNER_CACHE_MAXIMUM_SIZE:256}
    cache-ttl: ${C_RUNNER_CACHE_TTL:10m}
  email:
    invitation-base-url: ${APP_EMAIL_INVITATION_BASE_URL:http://localhost:${server.port}}
    invitation-expiration: ${APP_EMAIL_INVITATION_EXPIRATION:PT72H}
    from-address: ${APP_EMAIL_FROM_ADDRESS:no-reply@socratic-tutor.local}
    from-name: ${APP_EMAIL_FROM_NAME:Socratic Tutor}
    smtp:
      host: ${APP_EMAIL_SMTP_HOST:localhost}
      port: ${APP_EMAIL_SMTP_PORT:1025}
      username: ${APP_EMAIL_SMTP_USERNAME:}
      password: ${APP_EMAIL_SMTP_PASSWORD:}
      auth: ${APP_EMAIL_SMTP_AUTH:false}
      starttls-enabled: ${APP_EMAIL_SMTP_STARTTLS_ENABLED:false}
      ssl-enabled: ${APP_EMAIL_SMTP_SSL_ENABLED:false}
      connection-timeout: ${APP_EMAIL_SMTP_CONNECTION_TIMEOUT:5000}
      timeout: ${APP_EMAIL_SMTP_TIMEOUT:5000}
      write-timeout: ${APP_EMAIL_SMTP_WRITE_TIMEOUT:5000}

vaadin:
  allowed-packages: com.vaadin,org.vaadin,com.flowingcode,com.wornux
  launch-browser: true
---
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor:
                SimpleLoggerAdvisor: DEBUG
spring:
  ai:
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: true
    tools:
      throw-exception-on-error: true
      observations:
        include-content: true
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      lifecycle-management: start-only
  flyway:
    locations:
      - classpath:db/migration/prod
      - classpath:db/migration/dev

vaadin:
  frontend:
    hotdeploy: true
---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    locations: classpath:db/migration/prod
