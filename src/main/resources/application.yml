logging:
  level:
    org:
      atmosphere: warn
      springframework:
        ai:
          chat:
            model:
              MessageAggregator: off
server:
  port: ${PORT:3321}

spring:
  config:
    import:
      - optional:file:.env[.properties]
  profiles:
    default: dev
  servlet:
    multipart:
      enabled: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:4321}/socratic-tutor}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  flyway:
    enabled: true
    locations: classpath:db/migration/prod
    baseline-on-migrate: true
  jpa:
    packages-to-scan: com.wornux.data.entities
    hibernate:
      ddl-auto: validate
  docker:
    compose:
      lifecycle-management: none

  ai:
    session:
      repository:
        jdbc:
          initialize-schema: never
    vectorstore:
      pgvector:
        table-name: grounding_vector_store
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: false
        schema-validation: true
    model:
      chat: openai
      embedding: ollama
    openai:
      api-key: ${OPENAI_API_KEY:dummy}
      base-url: ${OPENAI_BASE_URL:http://127.0.0.1:8080/v1}
      timeout: ${OPENAI_TIMEOUT:5m}
      chat:
        model: ${CHAT_MODEL:AtomicChat/ornith-9b-GGUF:UD-Q4_K_XL}
    ollama:
      init:
        pull-model-strategy: when_missing
        timeout: 5m
        max-retries: 1
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${EMBEDDING_MODEL:qwen3-embedding:0.6b}
arconia:
  dev:
    services:
      docling:
        startup-timeout: 3m

app:
  security:
    disable-for-local-development: ${SECURITY_DISABLE:false}
  chat:
    context-window-tokens: ${CHAT_CONTEXT_WINDOW_TOKENS:8192}
    compaction-threshold-ratio: ${CHAT_COMPACTION_THRESHOLD_RATIO:0.70}
    ui:
      thinking-spinner: ${CHAT_UI_THINKING_SPINNER:snake}
  ai:
    guard:
      model: ${GUARD_MODEL:unsloth/gemma-4-E4B-it-GGUF:IQ4_XS}
    tutor:
      routing-model: ${ROUTING_MODEL:${spring.ai.openai.chat.model}}
    title:
      model: ${TITLE_MODEL:unsloth/gemma-4-E4B-it-GGUF:IQ4_XS}
    c-example-preparation:
      model: ${C_EXAMPLE_PREPARATION_MODEL:unsloth/gemma-4-E4B-it-GGUF:IQ4_XS}
  document-ingest:
    max-file-size-bytes: ${DOCUMENT_MAX_FILE_SIZE_BYTES:20971520}
    retrieval-top-k: ${DOCUMENT_RETRIEVAL_TOP_K:4}
    retrieval-similarity-threshold: ${DOCUMENT_RETRIEVAL_SIMILARITY_THRESHOLD:0.55}
    chunking:
      hybrid:
        max-tokens: ${DOCUMENT_CHUNK_MAX_TOKENS:512}
        merge-peers: ${DOCUMENT_CHUNK_MERGE_PEERS:true}
        use-markdown-tables: ${DOCUMENT_CHUNK_USE_MARKDOWN_TABLES:true}
        include-raw-text: ${DOCUMENT_CHUNK_INCLUDE_RAW_TEXT:true}
  c-runner:
    compiler-image: ${C_RUNNER_COMPILER_IMAGE:cristiandelahooz/socratic-tutor-crunner:latest}
    debugger-image: ${C_RUNNER_DEBUGGER_IMAGE:cristiandelahooz/socratic-tutor-crunner:latest}
    timeout: ${C_RUNNER_TIMEOUT:8s}
    debug-timeout: ${C_RUNNER_DEBUG_TIMEOUT:12s}
    max-source-bytes: ${C_RUNNER_MAX_SOURCE_BYTES:65536}
    max-snapshots: ${C_RUNNER_MAX_SNAPSHOTS:1000}
    max-output-bytes: ${C_RUNNER_MAX_OUTPUT_BYTES:16384}
    memory: ${C_RUNNER_MEMORY:128m}
    debugger-memory: ${C_RUNNER_DEBUGGER_MEMORY:512m}
    cpus: ${C_RUNNER_CPUS:0.5}
    pids-limit: ${C_RUNNER_PIDS_LIMIT:64}
    cache-maximum-size: ${C_RUNNER_CACHE_MAXIMUM_SIZE:256}
    cache-ttl: ${C_RUNNER_CACHE_TTL:10m}

socratic:
  email:
    invitation-base-url: ${SOCRATIC_EMAIL_INVITATION_BASE_URL:${app.base-url:http://localhost:${server.port}}}
    invitation-expiration: ${SOCRATIC_EMAIL_INVITATION_EXPIRATION:PT72H}
    from-address: ${SOCRATIC_EMAIL_FROM_ADDRESS:no-reply@socratic-tutor.local}
    from-name: ${SOCRATIC_EMAIL_FROM_NAME:Socratic Tutor}
    smtp:
      host: ${SOCRATIC_EMAIL_SMTP_HOST:localhost}
      port: ${SOCRATIC_EMAIL_SMTP_PORT:1025}
      username: ${SOCRATIC_EMAIL_SMTP_USERNAME:}
      password: ${SOCRATIC_EMAIL_SMTP_PASSWORD:}
      auth: ${SOCRATIC_EMAIL_SMTP_AUTH:false}
      starttls-enabled: ${SOCRATIC_EMAIL_SMTP_STARTTLS_ENABLED:false}
      ssl-enabled: ${SOCRATIC_EMAIL_SMTP_SSL_ENABLED:false}
      connection-timeout: ${SOCRATIC_EMAIL_SMTP_CONNECTION_TIMEOUT:5000}
      timeout: ${SOCRATIC_EMAIL_SMTP_TIMEOUT:5000}
      write-timeout: ${SOCRATIC_EMAIL_SMTP_WRITE_TIMEOUT:5000}

vaadin:
  allowed-packages: com.vaadin,org.vaadin,com.flowingcode,com.wornux
  launch-browser: true
  pnpm:
    enable: true
---
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor:
                SimpleLoggerAdvisor: DEBUG
spring:
  ai:
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: true
    tools:
      throw-exception-on-error: true
      observations:
        include-content: true
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      lifecycle-management: start-only
  flyway:
    locations:
      - classpath:db/migration/prod
      - classpath:db/migration/dev

vaadin:
  frontend:
    hotdeploy: true
---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    locations: classpath:db/migration/prod
