[project]
name = "this-studio"
version = "0.1.0"
description = "Socratic tutor for C programming — ML pipeline, LoRA fine-tune, inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── Data ingestion & chunking ────────────────────────────────────────────
    "beautifulsoup4>=4.14.3",
    "ebooklib>=0.20",
    "firecrawl-py>=4.18.0",
    "tiktoken>=0.12.0",
    # ── Embeddings & vector store ────────────────────────────────────────────
    "chromadb>=1.5.2",
    "sentence-transformers>=5.2.3",
    "numpy>=2.4.2",
    # ── Synthetic data generation ────────────────────────────────────────────
    "ollama>=0.6.1",
    # ── Inference service ────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
# GPU-only extras — install on training / inference machines
train = [
    "torch>=2.3.0",
    "unsloth",
    "datasets>=2.20.0",
    "trl>=0.9.0",
]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "ipykernel>=6.29.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.backends.legacy:build"
